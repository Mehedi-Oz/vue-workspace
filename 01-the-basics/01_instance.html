<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>instance</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="app">
    <p>{{ greetings }}</p>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      setup() {
        const greetings = "Hello World!"
        return {
          greetings,
        }
      }
    }).mount('#app')
  </script>
</body>

</html>
