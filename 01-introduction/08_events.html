<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    .box {
      width: 300px;
      height: 300px;
      background-color: red;
    }
  </style>
</head>

<body>

  <div id="app">
    <p>Name: {{ name }}</p>
    <p>Click to change name</p>
    <div v-on:click="updateName">
      <button>Click</button>
    </div><br>
    <div v-on:dblclick="updateName">
      <button>Double Click</button>
    </div>
    <hr>
    <div class="box" v-on:mousemove="getCoord">
      hover here
      <p>x: {{ coord.x }}</p>
      <p>y: {{ coord.y }}</p>
    </div>

  </div>

  <script>
    let { createApp, ref } = Vue
    createApp({
      setup() {

        const name = ref('Hasan')
        function updateName() {
          name.value = 'Maha'
        }

        const coord = ref({ x: 0, y: 0 })

        function getCoord(event){
          coord.value.x = event.clientX;
          coord.value.y = event.clientY;
        }

        return { name, updateName, coord, getCoord }
      }
    }).mount('#app')
  </script>
</body>

</html>
